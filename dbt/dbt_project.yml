name: support_bi
version: "0.2.0"
config-version: 2
profile: support_bi

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Reporting window for dim_date.
  calendar_start: "2024-01-01"
  calendar_end: "2027-01-01"
  # fct_case_events reloads this many days before its latest event on each run.
  event_lookback_days: 3

models:
  support_bi:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  support_bi:
    +schema: reference

flags:
  send_anonymous_usage_stats: false
