name: support_bi
version: "0.2.0"
config-version: 2
profile: support_bi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Root of the raw zone written by `support-bi generate`; relative to dbt/.
  raw_root: "{{ env_var('SUPPORT_BI_RAW', '../data/raw') }}"

models:
  support_bi:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
