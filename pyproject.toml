[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-bi"
version = "0.1.0"
description = "Single-source-of-truth analytics for a cloud support organization: modelled case data, governed metrics, dashboards and automated leadership reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohammad Azam" }]
dependencies = [
  "numpy>=1.26",
  "pyarrow>=16",
  "pyyaml>=6",
]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.9,<1.10"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7", "pip-audit>=2.7", "dbt-duckdb>=1.9,<1.10", "types-PyYAML"]

[project.scripts]
support-bi = "support_bi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"
