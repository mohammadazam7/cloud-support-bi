name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Dependency audit
        run: pip-audit --skip-editable

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - run: pytest --cov=support_bi --cov-report=term-missing

  models:
    name: dbt models (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - name: Generate 90 days of synthetic data
        run: support-bi generate --out data/raw --days 90 --customers 400 --agents 30
      - name: Build and test every model
        working-directory: dbt
        run: dbt build --profiles-dir .
